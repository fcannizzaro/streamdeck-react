name: Publish DevTools
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Build devtools
        run: bun run build
        working-directory: packages/devtools

      - name: Copy LICENSE
        run: cp LICENSE packages/devtools/LICENSE

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/devtools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          version=$(node -p "require('./packages/streamdeck-react-devtools/package.json').version")
          gh release create "@fcannizzaro/streamdeck-react-devtools@${version}" --title "@fcannizzaro/streamdeck-react-devtools@${version}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
