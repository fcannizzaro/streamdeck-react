name: Publish DevTools
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: bun install

      - name: Build devtools
        run: bun run build
        working-directory: packages/devtools

      - name: Copy LICENSE
        run: cp LICENSE packages/devtools/LICENSE

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/devtools

      - name: Create GitHub Release
        run: |
          version=$(node -p "require('./packages/devtools/package.json').version")
          gh release create "@fcannizzaro/streamdeck-react-devtools@${version}" --title "@fcannizzaro/streamdeck-react-devtools@${version}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
